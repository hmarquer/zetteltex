name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Format (workspace, check)
        run: cargo fmt --check

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Clippy (workspace, warnings as errors)
        run: cargo clippy --workspace -- -D warnings

      - name: Audit dependencies
        run: cargo install cargo-audit --locked && cargo audit

      - name: Deny checks (licenses, duplicates, advisories)
        run: cargo install cargo-deny --locked && cargo deny check
