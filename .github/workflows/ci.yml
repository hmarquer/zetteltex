name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format (workspace, check)
        run: cargo fmt --check

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Clippy (workspace, warnings as errors)
        run: cargo clippy --workspace -- -D warnings

      - name: Audit dependencies
        run: cargo install cargo-audit --locked && cargo audit

      - name: Deny checks (licenses, duplicates, advisories)
        run: cargo install cargo-deny --locked && cargo deny check
