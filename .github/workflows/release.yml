name: Build and release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build release
        run: |
          cargo build --release
      - name: Prepare packaged artifact
        run: |
          mkdir -p artifacts
          echo "Listing target/release"
          ls -la target/release || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path target\\release\\zetteltex.exe -DestinationPath artifacts/zetteltex-${{ matrix.os }}.zip"
          else
            tar -C target/release -czf artifacts/zetteltex-${{ matrix.os }}.tar.gz zetteltex || true
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetteltex-${{ matrix.os }}
          path: |
            artifacts/*

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts from build
        uses: actions/download-artifact@v4
        with:
          name: zetteltex-ubuntu-latest
          path: artifacts

      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: zetteltex-macos-latest
          path: artifacts

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: zetteltex-windows-latest
          path: artifacts

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/zetteltex-ubuntu-latest/zetteltex
            artifacts/zetteltex-macos-latest/zetteltex
            artifacts/zetteltex-windows-latest/zetteltex.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
