name: Build and release

permissions:
  contents: write

on:
  release:
    types: [created]

jobs:
  build:
    name: Build artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Build release
        run: |
          cargo build --release
      - name: Prepare packaged artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          echo "Listing target/release"
          ls -la target/release || true
          tar -C target/release -czf artifacts/zetteltex-${{ matrix.os }}.tar.gz zetteltex || true

      - name: Prepare packaged artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Write-Host "Listing target\release"
          Get-ChildItem -Path target\release -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path target\release\zetteltex.exe -DestinationPath artifacts\zetteltex-${{ matrix.os }}.zip

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zetteltex-${{ matrix.os }}
          path: |
            artifacts/*

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zetteltex-ubuntu-latest
          path: artifacts

      - name: Download mac artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zetteltex-macos-latest
          path: artifacts

      - name: Download windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zetteltex-windows-latest
          path: artifacts

      - name: Upload assets to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/zetteltex-ubuntu-latest.tar.gz
            artifacts/zetteltex-macos-latest.tar.gz
            artifacts/zetteltex-windows-latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
