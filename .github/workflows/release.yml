name: Build and release

permissions:
  contents: write

on:
  release:
    types: [created]

jobs:
  build:
    name: Build artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build release
        run: |
          cargo build --release
      - name: Prepare packaged artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          echo "Listing target/release"
          ls -la target/release || true
          tar -C target/release -czf artifacts/zetteltex-${{ matrix.os }}.tar.gz zetteltex || true

      - name: Prepare packaged artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Write-Host "Listing target\release"
          Get-ChildItem -Path target\release -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path target\release\zetteltex.exe -DestinationPath artifacts\zetteltex-${{ matrix.os }}.zip

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetteltex-${{ matrix.os }}
          path: |
            artifacts/*

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: zetteltex-ubuntu-latest
          path: artifacts

      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: zetteltex-macos-latest
          path: artifacts

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: zetteltex-windows-latest
          path: artifacts

      - name: Upload linux asset to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/zetteltex-ubuntu-latest.tar.gz
          asset_name: zetteltex-ubuntu-latest.tar.gz
          asset_content_type: application/gzip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload mac asset to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/zetteltex-macos-latest.tar.gz
          asset_name: zetteltex-macos-latest.tar.gz
          asset_content_type: application/gzip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload windows asset to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/zetteltex-windows-latest.zip
          asset_name: zetteltex-windows-latest.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
